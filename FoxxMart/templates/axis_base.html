    <script type="text/javascript">
        var user = '{{request.user}}'

        function getToken(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        var csrftoken = getToken('csrftoken')

        function getCookie(name) {
            // Split cookie string and get all individual name=value pairs in an array
            var cookieArr = document.cookie.split(";");

            // Loop through the array elements
            for (var i = 0; i < cookieArr.length; i++) {
                var cookiePair = cookieArr[i].split("=");

                /* Removing whitespace at the beginning of the cookie name
                and compare it with the given string */
                if (name == cookiePair[0].trim()) {
                    // Decode the cookie value and return
                    return decodeURIComponent(cookiePair[1]);
                }
            }

            // Return null if not found
            return null;
        }
        var cart = JSON.parse(getCookie('cart'))

        if (cart == undefined) {
            cart = {}
            console.log('Cart Created!', cart)
            document.cookie = 'cart=' + JSON.stringify(cart) + ";domain=;path=/"
        }
        console.log('Cart:', cart)

    </script>

	<script>
		(function () {
			var key = 'axis-color-mode';
			function transitionToTheme(mode) {
				var overlay = document.querySelector('.axis-theme-transition');
				if (!overlay || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
					applyTheme(mode);
					return;
				}
				if (overlay.classList.contains('axis-theme-transition--covering')) return;
				overlay.classList.add('axis-theme-transition--covering');
				window.setTimeout(function () {
					applyTheme(mode);
					overlay.classList.remove('axis-theme-transition--covering');
				}, 270);
			}
			function applyTheme(mode) {
				document.documentElement.setAttribute('data-axis-theme', mode);
				document.body.classList.toggle('axis-theme--light', mode === 'light');
				document.body.classList.toggle('axis-theme--dark', mode !== 'light');
				var toggle = document.querySelector('.axis-theme-toggle');
				if (toggle) {
					var isLight = mode === 'light';
					toggle.setAttribute('aria-pressed', String(isLight));
					toggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
				}
				var menuGif = document.querySelector('.collapsible-menu__toggle img');
				if (menuGif) {
					menuGif.src = mode === 'light' ? "{% static 'images/III-light.gif' %}" : "{% static 'images/III-dark.gif' %}";
				}
				document.querySelectorAll('[data-theme-icon-light][data-theme-icon-dark]').forEach(function (icon) {
					icon.setAttribute('src', mode === 'light' ? icon.dataset.themeIconLight : icon.dataset.themeIconDark);
				});
			}
			var themeTransition = document.createElement('div');
			themeTransition.className = 'axis-theme-transition';
			themeTransition.setAttribute('aria-hidden', 'true');
			themeTransition.innerHTML = '<div class="axis-theme-transition__shutter"></div><div class="axis-theme-transition__shutter"></div>';
			document.body.appendChild(themeTransition);
			var savedMode = localStorage.getItem(key) || 'light';
			applyTheme(savedMode);
			document.addEventListener('click', function (event) {
				var toggle = event.target.closest('.axis-theme-toggle');
				if (!toggle) return;
				var nextMode = document.body.classList.contains('axis-theme--light') ? 'dark' : 'light';
				localStorage.setItem(key, nextMode);
				transitionToTheme(nextMode);
			});
		}());
	</script>

    <script>
      var menuLeft = document.getElementById('cbp-spmenu-s1'),
          menuRight = document.getElementById('cbp-spmenu-s2'),
          showLeft = document.getElementById('showLeft'),
          showRight = document.getElementById('showRight'),
          showLeftPush = document.getElementById('showLeftPush'),
          showRightPush = document.getElementById('showRightPush'),
          body = document.body;

      /* These legacy controls are absent on checkout and other non-store pages. */
      if (menuLeft && menuRight && showLeft && showRight && showLeftPush && showRightPush) {
      showLeft.onclick = function() {
          classie.toggle(this, 'active');
          classie.toggle(menuLeft, 'cbp-spmenu-open');
          disableOther('showLeft');
      };
      showRight.onclick = function() {
          classie.toggle(this, 'active');
          classie.toggle(menuRight, 'cbp-spmenu-open');
          disableOther('showRight');
      };

      function closePushMenus() {
          classie.remove(showLeftPush, 'active');
          classie.remove(showRightPush, 'active');
          classie.remove(body, 'cbp-spmenu-push-toright');
          classie.remove(body, 'cbp-spmenu-push-toleft');
          classie.remove(menuLeft, 'cbp-spmenu-open');
          classie.remove(menuRight, 'cbp-spmenu-open');
      }

      menuLeft.addEventListener('click', function(event) {
          if (event.target.closest('.filter__item')) {
              closePushMenus();
          }
      });

      showLeftPush.onclick = function() {
          var opening = !classie.has(menuLeft, 'cbp-spmenu-open');
          closePushMenus();
          if (opening) {
              classie.add(this, 'active');
              classie.add(body, 'cbp-spmenu-push-toright');
              classie.add(menuLeft, 'cbp-spmenu-open');
          }
      };
      showRightPush.onclick = function() {
          var opening = !classie.has(menuRight, 'cbp-spmenu-open');
          closePushMenus();
          if (opening) {
              classie.add(this, 'active');
              classie.add(body, 'cbp-spmenu-push-toleft');
              classie.add(menuRight, 'cbp-spmenu-open');
          }
      };

      function disableOther(button) {
          if (button !== 'showLeft') {
              classie.toggle(showLeft, 'disabled');
          }
          if (button !== 'showRight') {
              classie.toggle(showRight, 'disabled');
          }
          if (button !== 'showLeftPush') {
              classie.toggle(showLeftPush, 'disabled');
          }
          if (button !== 'showRightPush') {
              classie.toggle(showRightPush, 'disabled');
          }
      }
      }
  </script>
