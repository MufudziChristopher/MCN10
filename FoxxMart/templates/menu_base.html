<body>
    <!-- Main container -->
    <div class="container">
        <!-- Blueprint header -->
        <header class="bp-header account-menu is-collapsed" data-account-menu>
            <button class="account-menu__toggle" type="button" aria-controls="account-navigation" aria-expanded="false">
              <span class="account-menu__brand" aria-label="FoxxMart">
                <span>F O</span><img src="{% static 'axis/static_root/images/XX-light.gif' %}" alt="XX"><span>M A R T</span>
              </span>
            </button>
            <nav id="account-navigation" aria-label="Account navigation">
                <a href="{% url 'home:home' %}" title="Portfolio">
                  <ion-icon name="apps-outline" size="large"></ion-icon>Portfolio
                </a>
                <a href="{% url 'home:mall' %}" title="FoxxMart Mall">
                  <ion-icon src="{% static 'ion-icons/home-outline.svg' %}" size="large"></ion-icon>FoxxMart
                </a>
                <a href="{% url 'home:contact' %}" title="Contact">
                  <ion-icon src="{% static 'ion-icons/mail-outline.svg' %}" size="large"></ion-icon>Contact
                </a>

                <a href="{% url 'account:register' %}" title="Create Account"{% if request.resolver_match.url_name == 'register' %} aria-current="page"{% endif %}>
                  <ion-icon src="{% static 'ion-icons/person-add-outline.svg' %}" size="large"></ion-icon>Register
                </a>
                <a href="{% url 'account:login' %}" title="Log in"{% if request.resolver_match.url_name == 'login' %} aria-current="page"{% endif %}>
                  <ion-icon src="{% static 'ion-icons/log-in-outline.svg' %}" size="large"></ion-icon>Login
                </a>

            </nav>
        </header>

        <script>
          (function () {
            var menu = document.querySelector('[data-account-menu]');
            if (!menu) return;
            var toggle = menu.querySelector('.account-menu__toggle');
            var setOpen = function (open) {
              menu.classList.toggle('is-collapsed', !open);
              toggle.setAttribute('aria-expanded', String(open));
            };
            toggle.addEventListener('click', function () { setOpen(menu.classList.contains('is-collapsed')); });
            document.addEventListener('keydown', function (event) {
              if (event.key === 'Escape') setOpen(false);
            });
          }());
        </script>

<div class="view">

  <!-- Grid -->

  <section class="grid grid--loader">
    {% block body  %}

    {% endblock  %}</section>
</div>
    <!-- /view -->
    <script src="{% static 'more/js/classie.js' %}"></script>
    <script src="{% static 'more/js/dummydata.js' %}"></script>
    <script src="{% static 'more/js/main.js' %}"></script>
    <script>
        (function() {
            var menuEl = document.getElementById('ml-menu');
            if (!menuEl) return;
            var mlmenu = new MLMenu(menuEl, {
                    // breadcrumbsCtrl : true, // show breadcrumbs
                    // initialBreadcrumb : 'all', // initial breadcrumb text
                    backCtrl: false, // show back button
                    // itemsDelayInterval : 60, // delay between each menu item sliding animation
                    onItemClick: loadDummyData // callback: item that doesn´t have a submenu gets clicked - onItemClick([event], [inner HTML of the clicked item])
                });

            // mobile menu toggle
            var openMenuCtrl = document.querySelector('.action--open'),
                closeMenuCtrl = document.querySelector('.action--close');

            openMenuCtrl.addEventListener('click', openMenu);
            closeMenuCtrl.addEventListener('click', closeMenu);

            function openMenu() {
                classie.add(menuEl, 'menu--open');
                closeMenuCtrl.focus();
            }

            function closeMenu() {
                classie.remove(menuEl, 'menu--open');
                openMenuCtrl.focus();
            }

            // simulate grid content loading
            var gridWrapper = document.querySelector('.contentt');

            function loadDummyData(ev, itemName) {
                ev.preventDefault();

                closeMenu();
                gridWrapper.innerHTML = '';
                classie.add(gridWrapper, 'content--loading');
                setTimeout(function() {
                    classie.remove(gridWrapper, 'content--loading');
                    gridWrapper.innerHTML = '<ul class="productts">' + dummyData[itemName] + '<ul>';
                }, 700);
            }
        })();
    </script>

    <script type="text/javascript">
        document.addEventListener('mousemove', e => {

            let bubles = document.createElement('bubles');
            let x = e.pageX;
            let y = e.pageY;
            bubles.style.left = x + "px";
            bubles.style.top = y + "px";
            let size = Math.random() * 100;
            bubles.style.width = 1 + size + "px";
            bubles.style.height = 1 + size + "px";

            document.body.appendChild(bubles);
            setTimeout(function() {
                bubles.remove();
            }, 1100);
        });





        var africa_theme = localStorage.getItem('africa_theme')

        console.log("africa_spinner:", africa_spinner)
