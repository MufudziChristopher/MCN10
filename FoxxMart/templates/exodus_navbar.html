{% load static %}
<header class="exodus-menu">
  <details>
    <summary aria-label="Open Exodus navigation">
      <span class="exodus-menu__brand"><img src="{% static 'images/III-light.gif' %}" alt="" aria-hidden="true">EXODUS</span>
    </summary>
    <nav aria-label="Exodus navigation">
      <a href="{% url 'home:home' %}"><ion-icon name="{% if request.resolver_match.namespace == 'home' and request.resolver_match.url_name == 'home' %}apps{% else %}apps-outline{% endif %}" aria-hidden="true"></ion-icon><span>Portfolio</span></a>
      <a href="{% url 'home:mall' %}"><ion-icon name="{% if request.resolver_match.namespace == 'home' and request.resolver_match.url_name == 'mall' %}grid{% else %}grid-outline{% endif %}" aria-hidden="true"></ion-icon><span>FoxxMart</span></a>
      <a href="{% url 'EXODUS:store' %}"{% if request.resolver_match.url_name == 'store' %} aria-current="page"{% endif %}><ion-icon name="{% if request.resolver_match.url_name == 'store' %}storefront{% else %}storefront-outline{% endif %}" aria-hidden="true"></ion-icon><span>Store</span></a>
      <a href="{% url 'EXODUS:cart' %}"{% if request.resolver_match.url_name == 'cart' %} aria-current="page"{% endif %}><span class="exodus-menu__cart"><ion-icon name="cart-outline" aria-hidden="true"></ion-icon><b>{{ cartItems|default:0 }}</b></span><span>Cart</span></a>
      {% if user.is_authenticated %}
        <a href="{% url 'account:profile' %}?store=exodus"><ion-icon name="person-outline" aria-hidden="true"></ion-icon><span>Account</span></a>
        <a href="{% url 'account:logout' %}"><ion-icon name="log-out-outline" aria-hidden="true"></ion-icon><span>Logout</span></a>
      {% else %}
        <a href="{% url 'account:register' %}"><ion-icon name="person-add-outline" aria-hidden="true"></ion-icon><span>Register</span></a>
        <a href="{% url 'account:login' %}?store=exodus&amp;next={{ request.path|urlencode }}"><ion-icon name="log-in-outline" aria-hidden="true"></ion-icon><span>Login</span></a>
      {% endif %}
      <a href="{% url 'EXODUS:contact' %}"{% if request.resolver_match.url_name == 'contact' %} aria-current="page"{% endif %}><ion-icon name="{% if request.resolver_match.url_name == 'contact' %}mail{% else %}mail-outline{% endif %}" aria-hidden="true"></ion-icon><span>Contact</span></a>
      <a href="{% url 'EXODUS:about' %}"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}><ion-icon name="{% if request.resolver_match.url_name == 'about' %}information-circle{% else %}information-circle-outline{% endif %}" aria-hidden="true"></ion-icon><span>About</span></a>
      {% if user.is_superuser %}<a href="{% url 'EXODUS:dashboard' %}"><ion-icon name="options-outline" aria-hidden="true"></ion-icon><span>Dashboard</span></a>{% endif %}
    </nav>
  </details>
</header>
